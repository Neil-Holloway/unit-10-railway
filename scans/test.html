<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lounge scan test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202020; }
  #info { position: absolute; top: 8px; left: 8px; color: #fff; font-family: sans-serif; font-size: 13px; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 4px; z-index: 10; }
</style>
</head>
<body>
<div id="info">Loading scan…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const info = document.getElementById('info');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(3, 3, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.4);
dir.position.set(5, 10, 5);
scene.add(dir);
const dir2 = new THREE.DirectionalLight(0xffffff, 1.0);
dir2.position.set(-5, 8, -5);
scene.add(dir2);
scene.add(new THREE.AxesHelper(1));

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.update();

const loader = new GLTFLoader();
loader.load(
  './bed2-scan-v2.glb',
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);

    // Scan textures are typically already baked (lit) from capture, so
    // force unlit rendering of the raw texture/vertex colours — this is
    // a diagnostic step to see true captured colour/detail without our
    // own scene lighting doubling up or washing it out.
    model.traverse((o) => {
      if (o.isMesh && o.material) {
        const old = o.material;
        o.material = new THREE.MeshBasicMaterial({
          map: old.map || null,
          vertexColors: old.vertexColors || false,
          color: old.map ? 0xffffff : (old.color || 0xffffff),
        });
      }
    });

    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    info.textContent =
      `Loaded. Size: ${size.x.toFixed(2)} x ${size.y.toFixed(2)} x ${size.z.toFixed(2)} m. ` +
      `Center: (${center.x.toFixed(2)}, ${center.y.toFixed(2)}, ${center.z.toFixed(2)})`;

    // Frame the camera on the model regardless of its exported scale/origin.
    const maxDim = Math.max(size.x, size.y, size.z);
    controls.target.copy(center);
    camera.position.set(center.x + maxDim, center.y + maxDim * 0.6, center.z + maxDim);
    camera.near = maxDim / 1000;
    camera.far = maxDim * 100;
    camera.updateProjectionMatrix();
    controls.update();

    window.__scanInfo = { size, center, maxDim, model };
    window.__cam = camera;
    window.__controls = controls;
    // Dolly the camera toward the current orbit target by a fraction of
    // the remaining distance, keeping the same look direction — lets us
    // zoom in step by step via eval without needing to guess absolute
    // world coordinates inside this unfamiliar scan.
    window.__dollyIn = (frac = 0.5) => {
      const dir = new THREE.Vector3().subVectors(controls.target, camera.position);
      camera.position.addScaledVector(dir, frac);
      controls.update();
    };
    window.THREE = THREE;
  },
  (xhr) => {
    if (xhr.total) {
      info.textContent = `Loading… ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
    }
  },
  (err) => {
    info.textContent = 'Failed to load: ' + err.message;
    console.error(err);
  }
);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>

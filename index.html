<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Unit 10 Railway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ec; }
  canvas { display: block; }
  #ui {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    font-family: system-ui, sans-serif;

<body>

<div id="ui">
  <div>
    <button id="viewChild" class="active">Child's-eye view</button>
    <button id="viewBird">Bird's-eye view</button>
    <button id="viewScan">Real scan view</button>
    <button id="viewHall">Hall</button>
  </div>
  <div id="scanStatus" style="margin-top: 6px; font-size: 12px; opacity: 0.8;"></div>
  <div style="margin-top: 8px;">
    <button id="toggleRun">Pause</button>
    Speed: <span id="speedLabel">25</span> scale mph
    <input id="speedSlider" type="range" min="0" max="60" value="25" />
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ----------------------------------------------------------------------
   Unit 10 Railway — scaffold
   Flat and room are built at real (measured) scale: 1 three.js unit = 1 metre.
   The track and train are modelled at OO gauge, 1:76 — a real model railway
   laid on the floor of a real room, not a shrunk-down room.
   Measurements are from NOTES.md (the project brief).
------------------------------------------------------------------------- */

// ---------- Unit 10: living room / kitchen (measured) ----------
// The room is NOT a simple rectangle — a corner is cut away for the
// bathroom. Overall bounding box 4.37m x 8.91m, with a 2.60m x 1.80m
// notch removed from the corner where the kitchen and entrance meet
// (see NOTES.md, "Living room furniture + kitchen corrections", third
// and fourth passes). ROOM_POLY walks the six real walls in order;
// coordinates are metres, origin near the room's centre.
const CEILING_H = 2.28;   // metres

const ROOM_BOUND_W = 4.37;  // metres — overall bounding-box width (camera framing only)
const ROOM_BOUND_D = 8.91;  // metres — overall bounding-box depth (camera framing only)

// A -> B -> C -> D -> E -> F -> back to A
const ROOM_POLY = [
  [-2.185, -4.455], // A — top-left
  [ 2.185, -4.455], // B — top-right
  [ 2.185,  4.455], // C — bottom-right; B-C is the 8.91m doorway/cupboard/sofa wall
  [ 0.415,  4.455], // D — C-D is the 1.77m bottom wall stub
  [ 0.415,  2.655], // E — D-E is the 1.80m bathroom notch wall
  [-2.185,  2.655], // F — E-F is the 2.60m kitchen wall
];                   // F-A (7.11m) is the remaining left wall

function wallLength(p1, p2) {
  return Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
}

// ---------- OO gauge track ----------
const GAUGE = 0.0165;       // metres — 16.5mm, OO gauge
const SCALE = 76;           // 1:76

// ---------- Renderer / scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const childCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

// Bird's-eye is a true top-down architectural plan, not a perspective shot —
// an orthographic camera avoids any perspective tilt/skew showing wall or
// unit side-faces that shouldn't be visible from directly overhead.
// Fit the whole room into the frustum with margin, on whichever axis is the
// binding constraint for the current window shape — a fixed world-height
// half-extent (the old approach) left almost no horizontal margin on
// square/portrait windows, making the view look zoomed into one corner.
const BIRD_VIEW_MARGIN = 1.15; // 15% padding around the room on all sides
const birdCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
// Swapped between the living room's and the hall's own bounding box when
// the "Hall" button toggles rooms (see HALL_BOUND_W/D below), so the
// bird's-eye frustum reframes to whichever room is currently shown instead
// of staying sized for the (much bigger) living room.
let currentBoundW = ROOM_BOUND_W;
let currentBoundD = ROOM_BOUND_D;
function updateBirdFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  const neededHalfX = (currentBoundW / 2) * BIRD_VIEW_MARGIN;
  const neededHalfZ = (currentBoundD / 2) * BIRD_VIEW_MARGIN;
  let halfZ = neededHalfZ;
  let halfX = halfZ * aspect;
  if (halfX < neededHalfX) {
    halfX = neededHalfX;
    halfZ = halfX / aspect;
  }
  birdCamera.left = -halfX;
  birdCamera.right = halfX;
  birdCamera.top = halfZ;
  birdCamera.bottom = -halfZ;
  birdCamera.updateProjectionMatrix();
}
updateBirdFrustum();

let activeCamera = childCamera;

// ---------- Real scan backdrop ----------
// A genuine Polycam room-scan (GLTF export of the whole flat), aligned into
// the SAME coordinate space as the hand-built room/track/train so the train
// can be seen running through the real scanned geometry. The scan's local
// axes have no inherent relationship to ROOM_POLY's — the alignment below
// is a 180° rotation about Y (both X and Z negated) plus translation,
// derived by raycasting known landmarks in the scan (the long kitchen
// wall, the room's floor extent along Z) and cross-checking against
// ROOM_POLY's known wall lengths until a ROOM_POLY wireframe overlay,
// drawn directly into the scan and screenshotted from a top-down view,
// visually traced the real walls. See NOTES.md, "Real scan alignment",
// for the fit method.
//
// IMPORTANT: this must be a rotation (determinant +1), never a single-axis
// mirror (determinant -1). An earlier version used scale.x=-1 alone, which
// fit the wall footprint just as well (wall-length/extent matching can't
// tell a mirror from a rotation) but was wrong: it mirrored every real,
// recognisable texture in the scan (so the room looked backwards — the
// sofa appeared to be on the wrong wall) and it also fit the wrong real
// floor points per hand-built (x,z), which is what caused the track to
// float/clip through walls and furniture. Confirmed correct by checking
// which transform puts the ROOM_POLY notch over the real kitchen
// cabinets/sink (it's a true 180°, not a mirror) — see NOTES.md.
//
// scan-local -> world:  worldX = -scanX + SCAN_TX,  worldZ = -scanZ + SCAN_TZ
// i.e. scanRoomGroup.scale.set(-1, 1, -1), position = (SCAN_TX, y, SCAN_TZ)
//
// SCAN_FLOOR_Y: the scan's own floor sits at roughly y=-0.37 in its local
// space (it's not a flat plane at y=0 like the hand-built floor — Polycam
// didn't export the capture levelled to its own floor). Without this
// offset the track (laid at hand-built floor height, y=0) floats above the
// real floor. The real floor also isn't perfectly flat (scan warp), so
// some residual float/sink (roughly ±15cm) remains after a single global
// offset — a known limitation of a single handheld scan pass.
const SCAN_TX = 0.79;
const SCAN_TZ = 4.83;
const SCAN_FLOOR_Y = -0.37;

const scanRoomGroup = new THREE.Group();
scanRoomGroup.scale.set(-1, 1, -1);
scanRoomGroup.position.set(SCAN_TX, -SCAN_FLOOR_Y, SCAN_TZ);
scanRoomGroup.visible = false;
scene.add(scanRoomGroup);

let scanLoaded = false;
let scanLoading = false;
const scanStatusEl = document.getElementById('scanStatus');

function loadScanIfNeeded() {
  if (scanLoaded || scanLoading) return;
  scanLoading = true;
  scanStatusEl.textContent = 'Loading real scan…';
  const loader = new GLTFLoader();
  loader.load(
    'lounge-scan.glb',
    (gltf) => {
      const model = gltf.scene;
      scanRoomGroup.add(model);

      // The scan's textures are already baked/lit from capture — render
      // them unlit so they show their true captured colour rather than
      // being (incorrectly) re-lit by the main scene's lights.
      model.traverse((o) => {
        if (o.isMesh && o.material) {
          const old = o.material;
          o.material = new THREE.MeshBasicMaterial({
            map: old.map || null,
            vertexColors: old.vertexColors || false,
            color: old.map ? 0xffffff : (old.color || 0xffffff),
          });
        }
      });

      scanLoaded = true;
      scanLoading = false;
      scanStatusEl.textContent = 'Real scan loaded.';
    },
    (xhr) => {
      if (xhr.total) {
        scanStatusEl.textContent = `Loading real scan… ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
      }
    },
    (err) => {
      scanLoading = false;
      scanStatusEl.textContent = 'Failed to load real scan.';
      console.error(err);
    }
  );
}

// ---------- Real hall scan (second room) ----------
// Unlike the lounge/kitchen (built by hand from sketches/measurements, with
// the lounge GLB kept only as an untrusted, severely drift-distorted
// backdrop — see the lounge's own per-mesh bounding-box check in NOTES.md),
// the hall is modelled DIRECTLY from its own real scan: a careful,
// doors-closed, closed-loop capture whose bounding box and per-chunk floor
// heights check out as clean (mildly oversized vs the tape measurement,
// consistent with the scan reading into door recesses, not drift). The
// alignment below is a full rotation (not a mirror) derived by PCA on the
// scan's own floor-height point cloud: HALL_ANGLE is the principal-axis
// angle, HALL_CENTER is the floor point cloud's centroid (x,z), and
// HALL_FLOOR_Y is the dominant floor-height histogram bin. Because
// three.js's rotation.y convention matches the PCA (u,v) projection formula
// exactly, applying this single rotation+translation to the scan maps it
// directly into a world frame where the floor is at y=0, the room's centre
// is at the origin, and world x/z ARE the PCA long/short axes (u,v) —
// so track waypoints below can be written as plain (x,z) metres, exactly
// like the living room's TRACK_WAYPOINTS.
const HALL_FLOOR_Y = -1.57;
const HALL_CENTER = { x: -0.07255600814664044, z: 0.012245417515271695 };
const HALL_ANGLE = -1.5446548533802604;
// Fitted rectangle from the same PCA pass: long axis (world x) ~4.78m,
// short axis (world z) ~1.51m — used only for bird's-eye camera framing.
const HALL_BOUND_W = 4.78;
const HALL_BOUND_D = 1.51;

const scanHallGroup = new THREE.Group();
scanHallGroup.rotation.y = HALL_ANGLE;
scanHallGroup.position.copy(
  new THREE.Vector3(-HALL_CENTER.x, -HALL_FLOOR_Y, -HALL_CENTER.z).applyAxisAngle(new THREE.Vector3(0, 1, 0), HALL_ANGLE)
);
scanHallGroup.visible = false;
scene.add(scanHallGroup);

let hallScanLoaded = false;
let hallScanLoading = false;

function loadHallScanIfNeeded() {
  if (hallScanLoaded || hallScanLoading) return;
  hallScanLoading = true;
  scanStatusEl.textContent = 'Loading hall scan…';
  const loader = new GLTFLoader();
  loader.load(
    'scans/hall-scan.glb',
    (gltf) => {
      const model = gltf.scene;
      scanHallGroup.add(model);
      // Same unlit treatment as the lounge scan — the capture's textures
      // are already baked/lit, so re-lighting them with the scene's own
      // lights would double up/wash out the real captured colour.
      model.traverse((o) => {
        if (o.isMesh && o.material) {
          const old = o.material;
          o.material = new THREE.MeshBasicMaterial({
            map: old.map || null,
            vertexColors: old.vertexColors || false,
            color: old.map ? 0xffffff : (old.color || 0xffffff),
          });
        }
      });
      hallScanLoaded = true;
      hallScanLoading = false;
      scanStatusEl.textContent = 'Hall scan loaded.';
    },
    (xhr) => {
      if (xhr.total) {
        scanStatusEl.textContent = `Loading hall scan… ${(xhr.loaded / xhr.total * 100).toFixed(0)}%`;
      }
    },
    (err) => {
      hallScanLoading = false;
      scanStatusEl.textContent = 'Failed to load hall scan.';
      console.error(err);
    }
  );
}

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x55606a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(3, 4, 2);
sun.castShadow = true;
scene.add(sun);

// ---------- Room shell: L-shaped floor + one wall per polygon edge ----------
// Floor and wall finishes are matched from photos (flooring close-up,
// wall close-up, 2026-10-25) — see NOTES.md "Floor and wall finishes".
const floorShape = new THREE.Shape();
ROOM_POLY.forEach(([x, z], i) => {
  // The shape plane becomes the floor once rotated -90° about X, which
  // maps local y to world -z — so plot (x, -z) here.
  if (i === 0) floorShape.moveTo(x, -z);
  else floorShape.lineTo(x, -z);
});
floorShape.closePath();

// Procedural plank texture: pale grey-beige oak-effect boards, matched
// from the flooring close-up photo. ShapeGeometry's auto-generated UVs
// run 0-1 across the shape's own bounding box (u along world x, v along
// world -z), so repeat counts here are derived directly from the real
// room dimensions and the real plank width (confirmed from the photo:
// "tiles are 19cm wide") rather than picked by eye. Plank LENGTH isn't
// measured — 1.2m is a typical-board-length ASSUMPTION purely so the
// end-joint seams drawn into the texture repeat at a plausible interval.
function makeFloorTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#c9c3b7';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Subtle wood-grain streaks, randomly placed and shaded.
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const len = 10 + Math.random() * 40;
    ctx.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(80,70,55,0.06)';
    ctx.lineWidth = 1 + Math.random();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len * (Math.random() - 0.5) * 0.3, y + len);
    ctx.stroke();
  }

  // Plank edge seam (long edge, repeats as the board width).
  ctx.strokeStyle = 'rgba(60,52,40,0.35)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, canvas.height);
  ctx.stroke();

  // A few random end-to-end board joints along the plank's length.
  ctx.strokeStyle = 'rgba(60,52,40,0.25)';
  for (let i = 0; i < 3; i++) {
    const y = Math.random() * canvas.height;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  const PLANK_WIDTH = 0.19;  // metres — measured from the flooring photo
  const PLANK_LENGTH = 1.2;  // metres — ASSUMPTION, not measured
  texture.repeat.set(ROOM_BOUND_W / PLANK_WIDTH, ROOM_BOUND_D / PLANK_LENGTH);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

// The hand-built room shell + furniture all live in one group so it can be
// hidden as a unit when the real scan backdrop (below) is shown instead —
// see "Real scan backdrop" section.
const handBuiltRoomGroup = new THREE.Group();
scene.add(handBuiltRoomGroup);

const floor = new THREE.Mesh(
  new THREE.ShapeGeometry(floorShape),
  new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: 0.85, side: THREE.DoubleSide })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
handBuiltRoomGroup.add(floor);

// Wall colour: light warm greige, matched from the wall close-up photo.
const wallMat = new THREE.MeshStandardMaterial({ color: 0xd8d3c9, roughness: 0.95, side: THREE.DoubleSide });
function addWall(p1, p2) {
  const length = wallLength(p1, p2);
  const vertical = Math.abs(p1[0] - p2[0]) < 1e-6; // edge runs along Z
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(length, CEILING_H), wallMat);
  wall.position.set((p1[0] + p2[0]) / 2, CEILING_H / 2, (p1[1] + p2[1]) / 2);
  wall.rotation.y = vertical ? Math.PI / 2 : 0;
  wall.receiveShadow = true;
  handBuiltRoomGroup.add(wall);
  return wall;
}
for (let i = 0; i < ROOM_POLY.length; i++) {
  addWall(ROOM_POLY[i], ROOM_POLY[(i + 1) % ROOM_POLY.length]);
}

// ---------- Furniture: kitchen U, table, cupboard run, sofa ----------
// First-pass layout anchored to the confirmed ROOM_POLY corners (see
// NOTES.md, "Living room furniture + kitchen corrections", passes 2-4).
// Box footprints only — not real unit/furniture models. Several
// placements are best-effort interpretations of ambiguous sketch notes
// (flagged below with ASSUMPTION) and still need confirming against
// photos before treating as exact.
const kitchenGroup = new THREE.Group();
const furnitureGroup = new THREE.Group();
handBuiltRoomGroup.add(kitchenGroup, furnitureGroup);

const UNIT_DEPTH = 0.6;      // standard worktop depth
const WORKTOP_H = 0.9;       // standard worktop height
const TALL_UNIT_H = 2.0;     // fridge / larder height
const CAP_T = 0.04;          // worktop cap thickness

// Room corners, named as in NOTES.md (x, z):
const A = { x: -2.185, z: -4.455 }; // top-left (back-left of whole room)
const F = { x: -2.185, z: 2.655 };  // kitchen's own back-left corner (left wall meets front wall)
const E = { x: 0.415, z: 2.655 };   // kitchen's front-right corner (front wall meets bathroom notch wall)
const B = { x: 2.185, z: -4.455 };  // top-right
const C = { x: 2.185, z: 4.455 };   // bottom-right, by the entrance

// Materials matched from furniture photos (2026-10-25) — see NOTES.md
// "Floor and wall finishes". Real kitchen units are white gloss, the
// fridge/freezer is a Samsung stainless-steel American-style model, the
// sofa is a white/cream leather L-shaped corner sofa, and the bookcase
// is plain white — all previously placeholder colours.
const unitMat = new THREE.MeshStandardMaterial({ color: 0xf2f1ee, roughness: 0.15, metalness: 0.05 }); // white gloss kitchen units
const applianceMat = new THREE.MeshStandardMaterial({ color: 0xaeb2b5, roughness: 0.3, metalness: 0.75 }); // stainless-steel fridge/freezer
const sofaMat = new THREE.MeshStandardMaterial({ color: 0xede6d8, roughness: 0.35, metalness: 0.05 }); // white/cream leather sofa
const bookcaseMat = new THREE.MeshStandardMaterial({ color: 0xf2f0ec, roughness: 0.55 }); // white bookcase
const furnitureLegMat = new THREE.MeshStandardMaterial({ color: 0x33281f, roughness: 0.6 }); // dark feet/legs
// ASSUMPTION (2026-10-25): no photo shows the worktop, sink, hob, oven or
// microwave specifically — a light stone-effect laminate worktop and dark
// glass/chrome appliance trim are a reasonable match for the white gloss
// units, not confirmed against a photo. See NOTES.md.
const worktopMat = new THREE.MeshStandardMaterial({ color: 0xdedad2, roughness: 0.25, metalness: 0.05 }); // worktop cap
const hobMat = new THREE.MeshStandardMaterial({ color: 0x15151a, roughness: 0.15, metalness: 0.2 }); // hob glass / oven window / microwave door
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xc9cdd0, roughness: 0.15, metalness: 0.9 }); // tap, rings, handles
const sinkBasinMat = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.4, metalness: 0.6 }); // dark basin interior, deliberately darker than applianceMat for visibility

function addBlock(parent, mat, w, h, d, cx, cy, cz) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(cx, cy, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// Thin worktop slab sitting on top of a worktop-height cabinet run, with a
// small lip overhang on all sides. Takes the same (w, d, cx, cz) footprint
// args already used for the cabinet box underneath, so every call site
// just reuses its existing addBlock arguments.
function addWorktopCap(parent, w, d, cx, cz) {
  addBlock(parent, worktopMat, w + 0.04, CAP_T, d + 0.04, cx, WORKTOP_H + CAP_T / 2, cz);
}

// Cabinet-door detailing for a worktop-height cabinet box, so it reads as
// a run of kitchen units rather than a plain slab, regardless of which
// pair of faces ends up facing the camera: a dark recessed kickboard
// along the floor, vertical door-seam grooves spaced along the run, and a
// handle on each door panel — applied to BOTH long faces (we don't track
// true wall-facing orientation per call site, so decorating both is the
// simple, robust option; the back face is against a wall in reality and
// is never seen anyway).
const kickboardMat = new THREE.MeshStandardMaterial({ color: 0x1c1a17, roughness: 0.7 });
const seamMat = new THREE.MeshStandardMaterial({ color: 0xcfc9bd, roughness: 0.3 });
function addCabinetDetail(parent, w, d, cx, cz) {
  const KICK_H = 0.10;
  const KICK_INSET = 0.04;
  const kickboard = new THREE.Mesh(
    new THREE.BoxGeometry(w - KICK_INSET, KICK_H, d - KICK_INSET),
    kickboardMat
  );
  kickboard.position.set(cx, KICK_H / 2, cz);
  kickboard.castShadow = true;
  kickboard.receiveShadow = true;
  parent.add(kickboard);

  const doorTop = WORKTOP_H - 0.02;
  const doorBottom = KICK_H + 0.02;
  const doorH = doorTop - doorBottom;
  const doorY = (doorTop + doorBottom) / 2;
  const runLong = Math.max(w, d);
  const runShort = Math.min(w, d);
  const DOOR_W = 0.45;
  const doorCount = Math.max(1, Math.round(runLong / DOOR_W));
  const step = runLong / doorCount;

  for (let i = 1; i < doorCount; i++) {
    const offset = -runLong / 2 + i * step;
    const seam = new THREE.Mesh(new THREE.BoxGeometry(0.012, doorH, 0.012), seamMat);
    if (w >= d) seam.position.set(cx + offset, doorY, cz);
    else seam.position.set(cx, doorY, cz + offset);
    parent.add(seam);
  }

  const handleGeo = new THREE.BoxGeometry(0.02, 0.16, 0.02);
  for (let i = 0; i < doorCount; i++) {
    const offset = -runLong / 2 + (i + 0.5) * step + (i % 2 === 0 ? DOOR_W * 0.25 : -DOOR_W * 0.25);
    for (const side of [-1, 1]) {
      const handle = new THREE.Mesh(handleGeo, chromeMat);
      const faceOffset = (w >= d ? d : w) / 2 + 0.012;
      if (w >= d) handle.position.set(cx + offset, doorTop - 0.14, cz + side * faceOffset);
      else handle.position.set(cx + side * faceOffset, doorTop - 0.14, cz + offset);
      parent.add(handle);
    }
  }
}

// A stainless sink basin recessed into a worktop cap, plus a chrome mixer
// tap at the back (wall side). Local origin sits ON the worktop surface,
// centred on the counter footprint; local x runs wall side (-x) to open
// room side (+x) — this run's wall is at the smaller-x side, matching
// addBlock's own cx placement for this unit.
function makeSink(width, depth) {
  const g = new THREE.Group();
  const BASIN_W = width * 0.85;
  const BASIN_D = depth * 0.65;
  const BASIN_DEEP = 0.16;

  // Raised chrome rim (sits proud of the worktop) so the sink reads
  // clearly from above even before the dark basin void is visible.
  const rim = new THREE.Mesh(new THREE.BoxGeometry(BASIN_D + 0.05, 0.015, BASIN_W + 0.05), chromeMat);
  rim.position.set(0.03, 0.0075, 0);
  g.add(rim);

  // Dark basin interior — intentionally much darker than the stainless

  const basin = new THREE.Mesh(new THREE.BoxGeometry(BASIN_D, BASIN_DEEP, BASIN_W), sinkBasinMat);
  basin.position.set(0.03, -BASIN_DEEP / 2, 0);

  g.add(tapSpout);

  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// A settee modelled as a low seat platform + raised backrest along the
// wall side + armrest blocks at its free (non-joining) ends + small
// feet lifting it off the floor — a single solid box at "sofa height"
// read as a flat slab/blob rather than a recognisable settee. Local
// axes: z runs along the wall (the piece's length), x runs from the
// open room-facing front (-depth/2) to the wall-backed rear (+depth/2);
// this matches how addBlock's (w=depth, h, d=lengthAlongWall) boxes
// were already oriented, so swapping this in needs no change to the
// wall-sequencing placement code below.
function makeSofaUnit(mat, length, depth, arms) {
  const g = new THREE.Group();
  const LEG_H = 0.08;
  const SEAT_TOP = 0.40;
  const BACK_TOP = 0.82;
  const BACK_THICK = 0.16;
  const ARM_W = 0.18;
  const ARM_TOP = 0.60;

  const seatDepth = depth - BACK_THICK;
  const seat = new THREE.Mesh(new THREE.BoxGeometry(seatDepth, SEAT_TOP - LEG_H, length), mat);
  seat.position.set(-BACK_THICK / 2, LEG_H + (SEAT_TOP - LEG_H) / 2, 0);
  g.add(seat);

  const legGeo = new THREE.BoxGeometry(0.04, LEG_H, 0.04);
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) {
      const foot = new THREE.Mesh(legGeo, furnitureLegMat);
      foot.position.set(-BACK_THICK / 2 + sx * (seatDepth / 2 - 0.05), LEG_H / 2, sz * (length / 2 - 0.08));
      g.add(foot);
    }
  }

  const back = new THREE.Mesh(new THREE.BoxGeometry(BACK_THICK, BACK_TOP - SEAT_TOP, length), mat);
  back.position.set(depth / 2 - BACK_THICK / 2, SEAT_TOP + (BACK_TOP - SEAT_TOP) / 2, 0);
  g.add(back);

  // arms.armStart = armrest at local z = +length/2 (the end nearer
  // whatever was placed immediately BEFORE this piece along the wall);
  // arms.armEnd = armrest at local z = -length/2 (the end nearer
  // whatever comes immediately AFTER). Only the free/open ends of the
  // L-shape get an armrest — the inner corner where the chaise and main
  // piece join has none, matching the real sofa.
  if (arms.armStart) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(depth, ARM_TOP - LEG_H, ARM_W), mat);
    arm.position.set(0, LEG_H + (ARM_TOP - LEG_H) / 2, length / 2 - ARM_W / 2);
    g.add(arm);
  }
  if (arms.armEnd) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(depth, ARM_TOP - LEG_H, ARM_W), mat);
    arm.position.set(0, LEG_H + (ARM_TOP - LEG_H) / 2, -(length / 2 - ARM_W / 2));
    g.add(arm);
  }

  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// A bookcase modelled as open shelving (two sides + back panel + shelf
// boards) rather than a solid box — the real bookcase (photo) is an
// open cube-shelf unit, not a closed cabinet.
function makeBookcase(mat, w, h, d) {
  const g = new THREE.Group();
  const SIDE_T = 0.025;
  const SHELF_T = 0.02;
  const SHELVES = 4; // number of shelf boards -> 3 open compartments + base/top

  for (const sx of [-1, 1]) {
    const side = new THREE.Mesh(new THREE.BoxGeometry(SIDE_T, h, d), mat);
    side.position.set(sx * (w / 2 - SIDE_T / 2), h / 2, 0);
    g.add(side);
  }
  const back = new THREE.Mesh(new THREE.BoxGeometry(w - SIDE_T * 2, h, 0.01), mat);
  back.position.set(0, h / 2, -d / 2 + 0.005);
  g.add(back);
  for (let i = 0; i <= SHELVES; i++) {
    const y = Math.min((h / SHELVES) * i, h - SHELF_T / 2);
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(w - SIDE_T * 2, SHELF_T, d), mat);
    shelf.position.set(0, y, 0);
    g.add(shelf);
  }

  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// ---------- Track: perimeter loop ----------
// Second iteration: instead of a compact oval sitting in the middle of the
// room, the loop hugs the room's actual furniture on both the outbound and
// return legs, using the full depth of the room (north wall down to the
// doorway foyer by the entrance, per NOTES.md). Two separated lanes
// (outbound down the west/kitchen side, return up the east/sofa side) run
// parallel wherever the room is wide enough, and funnel close together
// through two genuine pinch points where the room narrows to a single
// double-track-width corridor:
//   - the kitchen/doorway-cupboard neck (x 0.415-1.585, z 0.75-3.45)
//   - the sofa-chaise neck (x -1.585-0.235, z -1.855 to -0.955)
// The south end finishes in the open doorway foyer (NOTES.md: "100cm clear
// from the doorway corner"), close to the corner nearest the entrance, so
// it is ready to be extended through a tunnel toward the hall later
// (see NOTES.md "Plan", item 4). All coordinates are absolute room/world
// metres, so trackGroup carries no transform of its own.
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const TRACK_HEIGHT = 0.003; // ~3mm rail height off the floor

// The two end turns are genuine constant-radius semicircles (like a real
// stadium-shaped oval's end caps), not sparse hand-placed corner points —
// a spline forced through only 1-2 points at a sharp direction reversal
// produces an uneven, pointy "V" with wildly swinging tangents, which is
// what made the train snap/spin unrealistically at each end instead of
// arcing round smoothly. Radius is kept small (0.25m) because both ends
// have limited clearance to the wall once the lane separation is added
// (0.555m at the south/doorway end, 0.79m at the north end).
const TURN_RADIUS = 0.25; // metres
const TURN_SEGS = 24;

function arcPoints(cx, cz, radius, fromDeg, toDeg, segs) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = THREE.MathUtils.degToRad(fromDeg + ((toDeg - fromDeg) * i) / segs);
    pts.push([cx + radius * Math.cos(a), cz + radius * Math.sin(a)]);
  }
  return pts;
}

// South turn: in the open doorway foyer, bulging toward the entrance
// (apex at +z, away from the room) between the kitchen-neck exit and the
// doorway-cupboard-run entrance.
const southArc = arcPoints(1.00, 4.15, TURN_RADIUS, 180, 0, TURN_SEGS); // west conn -> apex(+z) -> east conn

// North turn: in the open band below the north wall, bulging toward the
// wall (apex at -z, away from the room) between the sofa-run exit and the
// left-wall-cupboard entrance.
const northArc = arcPoints(-0.25, -4.15, TURN_RADIUS, 0, -180, TURN_SEGS); // east conn -> apex(-z) -> west conn

const TRACK_WAYPOINTS = [
  ...southArc, // west conn (0.75, 4.15) -> apex (1.00, 4.40) -> east conn (1.25, 4.15)
  // -- east lane, north-bound, clear of the doorway cupboards then the sofa --
  [ 1.35,  3.90],
  [ 1.35,  3.00],
  [ 1.35,  2.00],
  [ 1.35,  0.90], // exiting the kitchen/doorway-cupboard neck
  [ 0.90,  0.30], // crossing the fully-open band
  [ 0.30, -0.50],
  [-0.10, -1.40], // through the sofa-chaise neck (paired with the west lane)
  [ 0.70, -2.30], // clear of the sofa (main piece)'s west edge
  [ 0.90, -3.30],
  [ 0.20, -3.70], // funnelling in to the north turn's narrower gauge
  ...northArc, // east conn (0.00, -4.15) -> apex (-0.25, -4.40) -> west conn (-0.50, -4.15)
  // -- west lane, south-bound, clear of the left-wall cupboard then the kitchen --
  [-0.50, -3.70], // funnelling out from the north turn
  [-1.10, -3.20],
  [-1.35, -2.20], // clear of left-wall cupboard
  [-1.10, -1.40], // through the sofa-chaise neck (paired with the east lane at the same z)
  [-1.10, -0.30], // past the chaise, cupboard still clearing to the west
  [-0.30,  0.30], // crossing the fully-open band in front of the doorway gap
  [ 0.65,  0.90], // entering the kitchen/doorway-cupboard neck
  [ 0.65,  2.00],
  [ 0.65,  3.00], // bathroom wall now on the west side, not furniture
  [ 0.65,  3.90], // exiting the neck into the doorway foyer, feeding back into the south turn
];

// 'centripetal' parameterization (rather than the default-looking uniform
// 'catmullrom') is what three.js recommends for non-uniformly spaced
// points — the waypoints above are wildly uneven (tight arc points ~3cm
// apart vs straight runs ~1m apart), and uniform Catmull-Rom overshoots/
// loops in exactly that situation, right at the dense/sparse transitions.
//
// buildTrackSystem() turns a flat [x,z] waypoint array into everything
// that needs a point-on-the-track (rails, sleepers and train motion) via
// ONE shared, high-resolution arc-length table, rather than each consumer
// calling curve.getPointAt()/getTangentAt() independently. Those methods
// invert their own lower-resolution internal lookup table (default 200
// divisions, built from uniform-t sampling), which isn't precise enough
// across a ~15-20m loop mixing 3cm-tight turns with 1m-long straights —
// small inversion errors there were (a) making the train's speed visibly
// uneven frame to frame (jerk: measured up to a 57% step-distance swing
// before this fix), and (b) letting the rails themselves (previously
// re-fitted through a SECOND, separate Catmull-Rom curve built from offset
// points) diverge slightly from the train's actual path on the tight
// turns, which is what read as the train "leaving the track". Building our
// own table once, directly from raw curve.getPoint(t) samples, and having
// every consumer do simple distance-based lookups into it removes both
// problems at the source. Factored out (rather than one set of module-level
// consts) so the hall's independent oval can share the exact same, already
// bug-fixed machinery as the living room's loop.
const TRACK_SAMPLES = 6000;
function buildTrackSystem(waypoints, trackHeight = TRACK_HEIGHT) {
  const centreline = waypoints.map(([x, z]) => new THREE.Vector3(x, trackHeight, z));
  const curve = new THREE.CatmullRomCurve3(centreline, true, 'centripetal', 0.0);

  const trackPts = [];
  for (let i = 0; i <= TRACK_SAMPLES; i++) trackPts.push(curve.getPoint(i / TRACK_SAMPLES));
  const trackDist = [0];
  for (let i = 1; i < trackPts.length; i++) trackDist.push(trackDist[i - 1] + trackPts[i].distanceTo(trackPts[i - 1]));
  const trackLength = trackDist[trackDist.length - 1];

  // Binary-search trackDist for the two samples bracketing arc-length s,
  // then linearly interpolate position and (from the same two samples)
  // direction of travel — accurate to within a single sample's distance
  // (~trackLength/6000, a few mm), far finer than anything visible.
  function pointAndTangentAtDistance(s) {
    s = ((s % trackLength) + trackLength) % trackLength;
    let lo = 0, hi = trackDist.length - 1;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (trackDist[mid] <= s) lo = mid; else hi = mid;
    }
    const segLen = trackDist[hi] - trackDist[lo];
    const frac = segLen > 0 ? (s - trackDist[lo]) / segLen : 0;
    const point = trackPts[lo].clone().lerp(trackPts[hi], frac);
    const tangent = trackPts[hi].clone().sub(trackPts[lo]).normalize();
    return { point, tangent };
  }

  return { curve, trackPts, trackDist, trackLength, pointAndTangentAtDistance };
}

function buildRail(trackSystem, offset) {
  const divisions = TRACK_SAMPLES;
  const pts = [];
  for (let i = 0; i <= divisions; i++) {
    const s = (i / divisions) * trackSystem.trackLength;
    const { point, tangent } = trackSystem.pointAndTangentAtDistance(s);
    const side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
    pts.push(point.addScaledVector(side, offset));
  }
  // A straight line-segment path through these already-smooth, very
  // closely spaced points (~2.5mm apart) — no further curve-fitting step
  // that could reintroduce overshoot.
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0), divisions, 0.0015, 6, false);
}

const railMat = new THREE.MeshStandardMaterial({ color: 0x8a8d90, metalness: 0.6, roughness: 0.4 });
const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3626, roughness: 1 });
const sleeperGeo = new THREE.BoxGeometry(GAUGE * 2.2, 0.0015, 0.012);
const SLEEPER_COUNT = 260;

// Builds rail + sleeper meshes for a track system straight into the given
// group — used for both the living room's loop and the hall's oval.
function buildTrackMeshes(trackSystem, group) {
  const railL = new THREE.Mesh(buildRail(trackSystem, GAUGE / 2), railMat);
  const railR = new THREE.Mesh(buildRail(trackSystem, -GAUGE / 2), railMat);
  railL.castShadow = true;
  railR.castShadow = true;
  group.add(railL, railR);

  for (let i = 0; i < SLEEPER_COUNT; i++) {
    const s = (i / SLEEPER_COUNT) * trackSystem.trackLength;
    const { point, tangent } = trackSystem.pointAndTangentAtDistance(s);
    const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
    sleeper.position.copy(point);
    sleeper.position.y -= 0.0018;
    sleeper.lookAt(point.clone().add(tangent));
    group.add(sleeper);
  }
}

const livingRoomTrack = buildTrackSystem(TRACK_WAYPOINTS);
buildTrackMeshes(livingRoomTrack, trackGroup);

// ---------- Hall: simple single oval ----------
// Unlike the living room's dual-lane loop (which has to weave past real
// furniture), the hall is an open rectangular corridor once the doors are
// closed, so a simple single-track oval fits with no obstacles to route
// around. radius/centreline/arc-centre values below were validated by
// sampling 301 points round this exact curve and raycasting each straight
// down against the real hall scan mesh: 0 points came back off the real
// floor height or missed the mesh entirely. Coordinates are in the hall's
// own aligned (x=u long axis, z=v short axis) world frame established by
// scanHallGroup above — real usable corridor width through the core of the
// hall is a stable ~1.28-1.38m (narrower, erratic readings only right at
// the two doorway-reveal ends), comfortably clearing this oval's v range
// of roughly -0.30 to 0.40.
const HALL_TURN_RADIUS = 0.35;
const HALL_CENTRELINE_V = 0.05;
const HALL_WEST_TURN_U = -1.0;
const HALL_EAST_TURN_U = 0.6;
const HALL_TRACK_WAYPOINTS = [
  ...arcPoints(HALL_EAST_TURN_U, HALL_CENTRELINE_V, HALL_TURN_RADIUS, -90, 90, TURN_SEGS),
  [-0.2, HALL_CENTRELINE_V + HALL_TURN_RADIUS], // top straight midpoint
  ...arcPoints(HALL_WEST_TURN_U, HALL_CENTRELINE_V, HALL_TURN_RADIUS, 90, 270, TURN_SEGS),
  [-0.2, HALL_CENTRELINE_V - HALL_TURN_RADIUS], // bottom straight midpoint
];

// Unlike the hand-built living-room floor (a perfectly flat plane at
// y=0), the real hall scan's floor is genuinely uneven — a dense raycast
// sweep along this exact oval found real floor height varying from
// -0.011 to +0.015m around the single flat HALL_FLOOR_Y offset (worst
// bump at the west/top, near u=-0.86, v=0.40). At the living-room's
// default TRACK_HEIGHT (0.003m) the rail/sleeper meshes sat BELOW that
// bump and were swallowed by the real floor mesh there — visible as a
// chunk of missing track in bird's-eye view even though the train (which
// rides its own computed position, not the rendered mesh) still ran the
// full circuit correctly. Raised well clear of the worst real bump found.
const HALL_TRACK_HEIGHT = 0.025;

const hallTrackGroup = new THREE.Group();
hallTrackGroup.visible = false;
scene.add(hallTrackGroup);
const hallTrack = buildTrackSystem(HALL_TRACK_WAYPOINTS, HALL_TRACK_HEIGHT);
buildTrackMeshes(hallTrack, hallTrackGroup);

// The track actually driving the train right now — swapped by the "Hall"
// button below. Train meshes themselves are plain scene children (see
// "Train: tank engine + two coaches" below), not parented to either
// trackGroup or hallTrackGroup, so the SAME loco/coaches can run on
// whichever track is active without needing two sets of vehicles.
let activeTrack = livingRoomTrack;

// ---------- Train: tank engine + two coaches ----------
// Long axis of every vehicle runs along local Z, because Object3D.lookAt()
// (used in placeAt() below) faces an object's -Z axis at its target.
// Wheels/buffers/chimney are added for recognisable silhouette; axle
// gauge, body footprint and coupling offsets are unchanged from the
// original placeholder boxes.
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.4, roughness: 0.6 });
const WHEEL_R = 0.0075;

function addWheelPair(g, z) {
  for (const side of [-1, 1]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.004, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(side * (GAUGE / 2 + 0.002), WHEEL_R, z);
    wheel.castShadow = true;
    g.add(wheel);
  }
}

function makeLoco() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f3b57, metalness: 0.3, roughness: 0.5 });
  const detailMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.5, roughness: 0.4 });

  // Boiler: a horizontal cylinder, the classic tank-engine barrel shape.
  const boiler = new THREE.Mesh(new THREE.CylinderGeometry(0.0135, 0.0135, 0.075, 14), bodyMat);
  boiler.rotation.x = Math.PI / 2;
  boiler.position.set(0, 0.0225, 0.01);
  g.add(boiler);

  // Footplate/tanks: a flat base the boiler and cab sit on.
  const footplate = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.105), bodyMat);
  footplate.position.set(0, 0.012, 0);
  g.add(footplate);

  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.027, 0.04, 0.032), bodyMat);
  cab.position.set(0, 0.045, -0.034);
  g.add(cab);

  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.004, 0.018, 10), detailMat);
  chimney.position.set(0, 0.0525, 0.034);
  g.add(chimney);

  const dome = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.006, 0.01, 10), detailMat);
  dome.position.set(0, 0.0375, 0.006);
  g.add(dome);

  const buffer = new THREE.CylinderGeometry(0.0025, 0.0025, 0.012, 8);
  for (const side of [-1, 1]) {
    const b = new THREE.Mesh(buffer, detailMat);
    b.rotation.x = Math.PI / 2;
    b.position.set(side * 0.011, 0.018, 0.058);
    g.add(b);
  }

  addWheelPair(g, 0.032);
  addWheelPair(g, -0.028);

  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeCoach() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7a2e2e, roughness: 0.6 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c5c5c, roughness: 0.7 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0xbfd4de, roughness: 0.3, metalness: 0.2 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.03, 0.13), bodyMat);
  body.position.y = 0.024;
  g.add(body);

  // Window strip: a thin lighter band let into the body side, rather than
  // a plain solid box, so the coach reads as passenger stock.
  const windows = new THREE.Mesh(new THREE.BoxGeometry(0.0265, 0.012, 0.11), glassMat);
  windows.position.y = 0.03;
  g.add(windows);

  // Roof: a half-cylinder laid along the coach's length.
  const roofGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.13, 12, 1, false, 0, Math.PI);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.rotation.z = Math.PI / 2;
  roof.rotation.y = Math.PI / 2;
  roof.position.y = 0.039;
  g.add(roof);

  const buffer = new THREE.CylinderGeometry(0.0025, 0.0025, 0.012, 8);
  const bufferMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.5, roughness: 0.4 });
  for (const zEnd of [0.065, -0.065]) {
    for (const side of [-1, 1]) {
      const b = new THREE.Mesh(buffer, bufferMat);
      b.rotation.x = Math.PI / 2;
      b.position.set(side * 0.011, 0.012, zEnd + (zEnd > 0 ? 0.006 : -0.006));
      g.add(b);
    }
  }

  addWheelPair(g, 0.045);
  addWheelPair(g, -0.045);

  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const loco = makeLoco();
const coach1 = makeCoach();
const coach2 = makeCoach();
// Direct scene children, not parented to trackGroup — this is the SAME
// train whether the living room's loop or the hall's oval is active (see
// activeTrack above), so it can't live inside either room-specific group.
scene.add(loco, coach1, coach2);

// Thin coupling rods so the three vehicles read as one connected train
// rather than three separate floating blocks.
const couplingMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
function makeCoupling() {
  return new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 1, 6), couplingMat);
}
const coupling1 = makeCoupling();
const coupling2 = makeCoupling();
scene.add(coupling1, coupling2);

const UP = new THREE.Vector3(0, 1, 0);
function alignCoupling(mesh, posA, posB) {
  const dir = new THREE.Vector3().subVectors(posB, posA);
  const len = dir.length();
  mesh.position.copy(posA).addScaledVector(dir, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
}

// ---------- Train motion ----------
let scaleMph = 25;
let running = true;
let trainDist = 0; // metres travelled along the track (wraps at trackLength)

function metresPerSecondFromScaleMph(mph) {
  const realMps = mph * 0.44704; // mph -> m/s at full size
  return realMps / SCALE;        // model speed at 1:76
}

// Coaches are placed at a fixed trailing distance (in real metres) behind
// the loco along the SAME arc-length table the loco uses, rather than
// each vehicle being positioned independently — this is what makes the
// rake read as being pulled by the engine (rigidly spaced along the
// track it's following) instead of three vehicles moving on their own.
const COACH1_GAP = 0.17; // metres, loco to coach1
const COACH2_GAP = 0.34; // metres, loco to coach2

// Vehicles are positioned from their two WHEELBASE pivot points (the
// actual wheel-pair z positions passed to addWheelPair() below) sampled
// along the track, not a single centre point + tangent, and not the
// overall body half-length either. A single-pivot placement orients the
// whole rigid body from one sample, which swings the body's ends outward
// past the rails on tight curves — most visible on the coaches going
// round the 0.25m-radius end turns, where it read as the train sitting
// off the rails. Using the body's overall half-LENGTH (including the
// buffer/chimney overhang beyond the wheels) as the pivot span was still
// wrong even after switching off a single pivot: it extrapolates each
// end further past the track than the wheels actually reach, swinging
// the body outward on the bend — a real train's body overhangs its
// wheels on a curve, but the amount of overhang should fall out of the
// wheelbase geometry, not be baked into the sampling span itself.
// Sampling at the true wheelbase instead means the wheels sit exactly on
// the centreline, and the overhang beyond them (buffers, chimney, roof
// ends) swings out only as much as a real rigid vehicle's would.
const LOCO_HALF_LEN = 0.03;    // half the loco's wheelbase (wheel pairs at z=+0.032/-0.028)
const COACH_HALF_LEN = 0.045;  // half the coach's wheelbase (wheel pairs at z=+-0.045)

function placeAt(obj, s, halfLen) {
  const front = activeTrack.pointAndTangentAtDistance(s + halfLen).point;
  const back = activeTrack.pointAndTangentAtDistance(s - halfLen).point;
  const mid = front.clone().add(back).multiplyScalar(0.5);
  mid.y += 0.025;
  obj.position.copy(mid);
  const lookTarget = front.clone();
  lookTarget.y += 0.025;
  obj.lookAt(lookTarget);
}

function updateTrain(dt) {
  // Capture the camera's current offset from the loco IN THE LOCO'S OWN
  // (pre-move) local frame, before the loco is re-placed this frame. Plain
  // OrbitControls keeps the camera at a fixed offset in WORLD space from
  // its target — fine for a target that only translates, but the loco
  // also turns as it goes round a bend, so a world-space-fixed offset
  // gets left behind on the outside of the turn instead of swinging round
  // with it. Visually this read as the train drifting "about a track
  // width" to one side approaching a bend, then appearing to cross to the
  // other side through the bend before recentring on the next straight —
  // exactly the reported symptom, and confirmed NOT to be a train/rail
  // placement error by sampling placeAt() against both rail meshes at 40
  // points right round the loop (consistently sub-centimetre, no
  // region of sustained asymmetry). Re-deriving the camera's world
  // position from this local offset AFTER the loco's new orientation is
  // set (below) carries the offset round the bend rigidly with the loco,
  // like a camera on an arm bolted to the vehicle, while still letting
  // childControls.update() layer the user's own drag/zoom on top.
  const camLocalOffset = childCamera.position.clone().sub(loco.position).applyQuaternion(loco.quaternion.clone().invert());

  if (running) {
    const modelMps = metresPerSecondFromScaleMph(scaleMph);
    trainDist += modelMps * dt;
  }
  placeAt(loco, trainDist, LOCO_HALF_LEN);
  placeAt(coach1, trainDist - COACH1_GAP, COACH_HALF_LEN);
  placeAt(coach2, trainDist - COACH2_GAP, COACH_HALF_LEN);
  alignCoupling(coupling1, loco.position, coach1.position);
  alignCoupling(coupling2, coach1.position, coach2.position);

  childCamera.position.copy(loco.position).add(camLocalOffset.applyQuaternion(loco.quaternion));

  // Child's-eye orbits the LOCO, not a fixed point: the loop is now ~21m
  // round, so a static orbit point only has the train in view for a small
  // fraction of each lap — from everywhere else it just looks like an
  // empty track with no train "running" on it. Re-targeting the orbit
  // controls at the loco's position every frame (rather than moving the
  // camera itself) keeps whatever relative angle/distance the user has
  // chosen by dragging — it becomes a chase cam you can still freely
  // orbit around, not a fixed external shot.
  childControls.target.set(loco.position.x, 0.12, loco.position.z);
  childControls.update();
}

// ---------- Cameras ----------
// Child's-eye: a chase cam, height clamped to 30-50cm off the floor,
// orbiting the loco rather than a fixed point in the room (see
// updateTrain() — childControls.target is re-set to the loco's position
// every frame). loco/coach1/coach2 are still at their default (0,0,0)
// group-local position at this point — childControls is created first
// (updateTrain() reads it), then updateTrain(0) places the train on the
// track and re-targets childControls at the loco's actual starting
// point, and only then is the camera's starting offset computed from
// that real position — otherwise the camera stayed near the origin
// while the orbit target jumped to wherever the track starts, leaving
// the loco a tiny, distant speck in frame on the first render.
const childControls = new OrbitControls(childCamera, renderer.domElement);
childControls.minDistance = 0.3;
childControls.maxDistance = 4;
childControls.maxPolarAngle = Math.PI * 0.49;
updateTrain(0);
// Trail behind the loco along the track's own direction of travel at its
// starting point, not a fixed world-space diagonal offset — the loop's
// start point is close to the south wall, and a fixed +x/+z offset
// happened to push the camera straight through that wall (seen as a
// screen-filling grey/wall-backface render). The track itself is always
// clear of walls and furniture by design, so "behind the loco, along the
// rails" is guaranteed to be open floor wherever the loop happens to
// start.
{
  const { tangent } = activeTrack.pointAndTangentAtDistance(trainDist);
  const behind = loco.position.clone().addScaledVector(tangent, -0.35);
  childCamera.position.set(behind.x, 0.4, behind.z);
}
childControls.update();
childControls.addEventListener('change', () => {
  childCamera.position.y = Math.min(0.5, Math.max(0.3, childCamera.position.y));
});

// Bird's-eye: locked top-down plan view of the living room. Rotation is
// disabled entirely (orthographic + no tilt) so this always reads as a
// flat plan, not a perspective shot; pan and zoom still work.
birdCamera.position.set(0, 10, 0);
birdCamera.up.set(0, 0, -1); // avoid an undefined up-vector when looking straight down
birdCamera.lookAt(0, 0, 0);
const birdControls = new OrbitControls(birdCamera, renderer.domElement);
birdControls.target.set(0, 0, 0);
birdControls.enableRotate = false;
birdControls.minZoom = 0.4;
birdControls.maxZoom = 4;
birdControls.update();

// ---------- UI ----------
const btnChild = document.getElementById('viewChild');
const btnBird = document.getElementById('viewBird');
const btnScan = document.getElementById('viewScan');
function setActiveButton(btn) {
  [btnChild, btnBird, btnScan].forEach((b) => b.classList.toggle('active', b === btn));
}
btnChild.addEventListener('click', () => {
  activeCamera = childCamera;
  setActiveButton(btnChild);
});
btnBird.addEventListener('click', () => {
  activeCamera = birdCamera;
  setActiveButton(btnBird);
});
btnScan.addEventListener('click', () => {
  if (hallMode) return; // living-room-only toggle; irrelevant while the hall is shown
  loadScanIfNeeded();
  const showScan = !scanRoomGroup.visible;
  scanRoomGroup.visible = showScan;
  handBuiltRoomGroup.visible = !showScan;
  scene.background = new THREE.Color(showScan ? 0x202020 : 0xdfe6ec);
  btnScan.classList.toggle('active', showScan);
  btnScan.textContent = showScan ? 'Hand-built room' : 'Real scan view';
});

// ---------- Hall / living-room room switch ----------
// Mutually exclusive with the living room entirely (room, scan backdrop
// AND track all swap together) — rather than trying to let the hall's
// scan/track coexist with the living room's, which the real flat's own
// doorway would eventually bridge (see NOTES.md "Plan", item 4), this
// keeps the two rooms as two clean, independently-correct scenes for now.
let hallMode = false;
let preHallShowScan = false; // which living-room sub-view to restore on leaving the hall
const btnHall = document.getElementById('viewHall');
btnHall.addEventListener('click', () => {
  hallMode = !hallMode;
  if (hallMode) {
    loadHallScanIfNeeded();
    preHallShowScan = scanRoomGroup.visible;
    scanRoomGroup.visible = false;
    handBuiltRoomGroup.visible = false;
    trackGroup.visible = false;
    scanHallGroup.visible = true;
    hallTrackGroup.visible = true;
    activeTrack = hallTrack;
    currentBoundW = HALL_BOUND_W;
    currentBoundD = HALL_BOUND_D;
    scene.background = new THREE.Color(0x202020);
  } else {
    scanHallGroup.visible = false;
    hallTrackGroup.visible = false;
    trackGroup.visible = true;
    scanRoomGroup.visible = preHallShowScan;
    handBuiltRoomGroup.visible = !preHallShowScan;
    activeTrack = livingRoomTrack;
    currentBoundW = ROOM_BOUND_W;
    currentBoundD = ROOM_BOUND_D;
    scene.background = new THREE.Color(preHallShowScan ? 0x202020 : 0xdfe6ec);
  }
  trainDist = 0;
  updateBirdFrustum();
  btnHall.classList.toggle('active', hallMode);
  btnHall.textContent = hallMode ? 'Back to living room' : 'Hall';
});

const toggleBtn = document.getElementById('toggleRun');
toggleBtn.addEventListener('click', () => {
  running = !running;
  toggleBtn.textContent = running ? 'Pause' : 'Run';
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  scaleMph = Number(speedSlider.value);
  speedLabel.textContent = scaleMph;
});

// ---------- Resize ----------
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  childCamera.aspect = window.innerWidth / window.innerHeight;
  childCamera.updateProjectionMatrix();
  updateBirdFrustum();
});

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  // THREE.Clock.getDelta() returns real wall-clock time since the last
  // frame — if the tab is backgrounded (common right on page load before
  // it's foregrounded, or any time a user alt-tabs away and back),
  // requestAnimationFrame stops firing and dt on the next frame can be
  // several real seconds. Fed straight into updateTrain(), that one huge
  // step jumps the loco almost all the way round the loop (and through
  // corners) in a single frame; the chase-cam's rigid local offset,
  // carried over from the loco's heading BEFORE that jump and reapplied
  // after it, then points in an essentially arbitrary direction relative
  // to the loco's new (very different) heading — same fixed distance,
  // but often aimed straight into a wall. Clamping dt caps how far any
  // single frame can move the train, so a stalled tab just causes a
  // brief visible pause-and-resume instead of a corrupted camera.
  const dt = Math.min(clock.getDelta(), 0.1);
  updateTrain(dt);
  if (activeCamera === childCamera) childControls.update();
  if (activeCamera === birdCamera) birdControls.update();
  renderer.render(scene, activeCamera);
}
animate();
</script>
</body>
</html>

<html lang="en">

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ----------------------------------------------------------------------
   Unit 10 Railway — scaffold
   Flat and room are built at real (measured) scale: 1 three.js unit = 1 metre.
   The track and train are modelled at OO gauge, 1:76 — a real model railway
   laid on the floor of a real room, not a shrunk-down room.
   Measurements are from NOTES.md (the project brief).
------------------------------------------------------------------------- */

// ---------- Unit 10: living room / kitchen (measured) ----------
// The room is NOT a simple rectangle — a corner is cut away for the
// bathroom. Overall bounding box 4.37m x 8.91m, with a 2.60m x 1.80m
// notch removed from the corner where the kitchen and entrance meet
// (see NOTES.md, "Living room furniture + kitchen corrections", third
// and fourth passes). ROOM_POLY walks the six real walls in order;
// coordinates are metres, origin near the room's centre.
const CEILING_H = 2.28;   // metres

const ROOM_BOUND_W = 4.37;  // metres — overall bounding-box width (camera framing only)
const ROOM_BOUND_D = 8.91;  // metres — overall bounding-box depth (camera framing only)

// A -> B -> C -> D -> E -> F -> back to A
const ROOM_POLY = [
  [-2.185, -4.455], // A — top-left
  [ 2.185, -4.455], // B — top-right
  [ 2.185,  4.455], // C — bottom-right; B-C is the 8.91m doorway/cupboard/sofa wall
  [ 0.415,  4.455], // D — C-D is the 1.77m bottom wall stub
  [ 0.415,  2.655], // E — D-E is the 1.80m bathroom notch wall
  [-2.185,  2.655], // F — E-F is the 2.60m kitchen wall
];                   // F-A (7.11m) is the remaining left wall

function wallLength(p1, p2) {
  return Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
}

// ---------- OO gauge track ----------
const GAUGE = 0.0165;       // metres — 16.5mm, OO gauge
const SCALE = 76;           // 1:76

// ---------- Renderer / scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const childCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

// Bird's-eye is a true top-down architectural plan, not a perspective shot —
// an orthographic camera avoids any perspective tilt/skew showing wall or
// unit side-faces that shouldn't be visible from directly overhead.
// Fit the whole room into the frustum with margin, on whichever axis is the
// binding constraint for the current window shape — a fixed world-height
// half-extent (the old approach) left almost no horizontal margin on
// square/portrait windows, making the view look zoomed into one corner.
const BIRD_VIEW_MARGIN = 1.15; // 15% padding around the room on all sides
const birdCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
function updateBirdFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  const neededHalfX = (ROOM_BOUND_W / 2) * BIRD_VIEW_MARGIN;
  const neededHalfZ = (ROOM_BOUND_D / 2) * BIRD_VIEW_MARGIN;
  let halfZ = neededHalfZ;
  let halfX = halfZ * aspect;
  if (halfX < neededHalfX) {
    halfX = neededHalfX;
    halfZ = halfX / aspect;
  }
  birdCamera.left = -halfX;
  birdCamera.right = halfX;
  birdCamera.top = halfZ;
  birdCamera.bottom = -halfZ;
  birdCamera.updateProjectionMatrix();
}
updateBirdFrustum();

let activeCamera = childCamera;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x55606a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(3, 4, 2);
sun.castShadow = true;
scene.add(sun);

// ---------- Room shell: L-shaped floor + one wall per polygon edge ----------
const floorShape = new THREE.Shape();
ROOM_POLY.forEach(([x, z], i) => {
  // The shape plane becomes the floor once rotated -90° about X, which
  // maps local y to world -z — so plot (x, -z) here.
  if (i === 0) floorShape.moveTo(x, -z);
  else floorShape.lineTo(x, -z);
});
floorShape.closePath();

const floor = new THREE.Mesh(
  new THREE.ShapeGeometry(floorShape),
  new THREE.MeshStandardMaterial({ color: 0xb79c7a, roughness: 0.9, side: THREE.DoubleSide }) // placeholder wood finish
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf2efe9, roughness: 0.95, side: THREE.DoubleSide });
function addWall(p1, p2) {
  const length = wallLength(p1, p2);
  const vertical = Math.abs(p1[0] - p2[0]) < 1e-6; // edge runs along Z
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(length, CEILING_H), wallMat);
  wall.position.set((p1[0] + p2[0]) / 2, CEILING_H / 2, (p1[1] + p2[1]) / 2);
  wall.rotation.y = vertical ? Math.PI / 2 : 0;
  wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}
for (let i = 0; i < ROOM_POLY.length; i++) {
  addWall(ROOM_POLY[i], ROOM_POLY[(i + 1) % ROOM_POLY.length]);
}

// ---------- Furniture: kitchen U, table, cupboard run, sofa ----------
// First-pass layout anchored to the confirmed ROOM_POLY corners (see
// NOTES.md, "Living room furniture + kitchen corrections", passes 2-4).
// Box footprints only — not real unit/furniture models. Several
// placements are best-effort interpretations of ambiguous sketch notes
// (flagged below with ASSUMPTION) and still need confirming against
// photos before treating as exact.
const kitchenGroup = new THREE.Group();
const furnitureGroup = new THREE.Group();
scene.add(kitchenGroup, furnitureGroup);

const UNIT_DEPTH = 0.6;      // standard worktop depth
const WORKTOP_H = 0.9;       // standard worktop height
const TALL_UNIT_H = 2.0;     // fridge / larder height
const SOFA_H = 0.8;          // ASSUMPTION — typical sofa back height, not measured

// Room corners, named as in NOTES.md (x, z):
const A = { x: -2.185, z: -4.455 }; // top-left (back-left of whole room)
const F = { x: -2.185, z: 2.655 };  // kitchen's own back-left corner (left wall meets front wall)
const E = { x: 0.415, z: 2.655 };   // kitchen's front-right corner (front wall meets bathroom notch wall)
const B = { x: 2.185, z: -4.455 };  // top-right
const C = { x: 2.185, z: 4.455 };   // bottom-right, by the entrance

const unitMat = new THREE.MeshStandardMaterial({ color: 0xe4e1da, roughness: 0.7 });
const applianceMat = new THREE.MeshStandardMaterial({ color: 0xc9cdd1, roughness: 0.4, metalness: 0.3 });
const sofaMat = new THREE.MeshStandardMaterial({ color: 0x5b6b7a, roughness: 0.8 });
const tableMat = new THREE.MeshStandardMaterial({ color: 0x6b4a33, roughness: 0.6 });

function addBlock(parent, mat, w, h, d, cx, cy, cz) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(cx, cy, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

// --- Left-wall cupboard: 360cm, low (worktop height, not a tall tower —
// corrected from the original "peninsula tower" reading). Sequence along
// the left wall (A-F, 7.11m) from A: 79cm gap, 360cm cupboard, 82cm gap,
// then the kitchen U begins. Check: 0.79+3.60+0.82+0.60(leg)+1.30(base)
// = 7.11m exactly — matches the full A-F wall length, confirming this
// reading (see NOTES.md, "Kitchen layout — simplified").
const cupboardStartZ = A.z + 0.79;
const cupboardEndZ = cupboardStartZ + 3.60;
addBlock(
  kitchenGroup, unitMat,
  UNIT_DEPTH, WORKTOP_H, 3.60,
  A.x + UNIT_DEPTH / 2, WORKTOP_H / 2, (cupboardStartZ + cupboardEndZ) / 2
);

// --- Kitchen U: base (130cm, containing the sink) flush against the left
// wall, with two 260cm legs projecting into the room (+X) from each end,
// open side facing across the room toward the doorway-side cupboard run.
// Leg 2 is the already-modelled front-wall run (F-E, 260cm) below — its
// far edge (E.x = 0.415) exactly matches leg 1's far edge, closing the U.
const leg1StartZ = cupboardEndZ + 0.82;      // 82cm gap after the cupboard
const leg1EndZ = leg1StartZ + UNIT_DEPTH;    // leg is 60cm wide (same as worktop depth)
const legReachX = F.x + 2.60;                // both legs project 260cm into the room
addBlock(
  kitchenGroup, unitMat,
  legReachX - F.x, WORKTOP_H, UNIT_DEPTH,
  (F.x + legReachX) / 2, WORKTOP_H / 2, (leg1StartZ + leg1EndZ) / 2
);
const baseStartZ = leg1EndZ;
const baseEndZ = baseStartZ + 1.30;          // base is 130cm long; ends exactly at F
addBlock(
  kitchenGroup, unitMat,
  UNIT_DEPTH, WORKTOP_H, 1.30,
  F.x + UNIT_DEPTH / 2, WORKTOP_H / 2, (baseStartZ + baseEndZ) / 2
);

// --- Front wall run (U's second leg): the entire E-F wall, 2.60m. ---
addBlock(
  kitchenGroup, unitMat,
  Math.abs(E.x - F.x), WORKTOP_H, UNIT_DEPTH,
  (E.x + F.x) / 2, WORKTOP_H / 2, F.z - UNIT_DEPTH / 2
);

// --- Doorway-side cupboard/freezer/cupboard run, against the B-C wall ---
// (the 891cm doorway->sofa wall). Sequence confirmed by direct sum in
// NOTES.md: 100 clear (doorway) + 84 + 103 + 84 + 170 clear + 300 (sofa)
// + 15 + 35 = 891, walking from C (by the entrance) toward B.
// ASSUMPTION: worktop height for all three (not stated as tall units).
let cz = C.z - 1.0; // 100cm clear from the doorway corner
function addWallUnit(parent, mat, lengthAlongWall, depth, height) {
  const startZ = cz;
  cz -= lengthAlongWall;
  addBlock(
    parent, mat,
    depth, height, lengthAlongWall,
    B.x /* C.x === B.x */ - depth / 2, height / 2, (startZ + cz) / 2
  );
}
addWallUnit(kitchenGroup, unitMat, 0.84, UNIT_DEPTH, WORKTOP_H);       // cupboard
addWallUnit(kitchenGroup, applianceMat, 1.03, UNIT_DEPTH, WORKTOP_H);  // fridge/freezer
addWallUnit(kitchenGroup, unitMat, 0.84, UNIT_DEPTH, WORKTOP_H);       // cupboard

cz -= 1.70; // 170cm clear gap before the sofa

// --- L-shaped sofa, 300cm total along the wall ---
// Chaise (90 x 195, projecting further into the room) nearest the
// cupboards, main piece (210 x 108) continuing toward B/the bookcase.
addWallUnit(furnitureGroup, sofaMat, 0.90, 1.95, SOFA_H);  // chaise, projects deeper into the room
addWallUnit(furnitureGroup, sofaMat, 2.10, 1.08, SOFA_H);  // main piece

// --- Bookcase: 120 x 35cm, at right angles to the sofa in the top-right
// corner (where the right wall meets the top wall), flush against the
// top wall. A 25cm gap to the sofa was given, but placing the bookcase
// flush against the wall (more physically plausible than floating it off
// the wall) leaves a ~15cm computed gap to the sofa's far end instead —
// the ~10cm discrepancy is within hand-measurement tolerance; flagged in
// NOTES.md rather than silently forcing an exact match.
const BOOKCASE_H = 1.8; // ASSUMPTION — typical bookcase height, not measured
addBlock(
  furnitureGroup, tableMat,
  1.20, BOOKCASE_H, 0.35,
  B.x - 1.20 / 2, BOOKCASE_H / 2, A.z + 0.35 / 2
);

// ---------- Track: perimeter loop ----------
// Second iteration: instead of a compact oval sitting in the middle of the
// room, the loop hugs the room's actual furniture on both the outbound and
// return legs, using the full depth of the room (north wall down to the
// doorway foyer by the entrance, per NOTES.md). Two separated lanes
// (outbound down the west/kitchen side, return up the east/sofa side) run
// parallel wherever the room is wide enough, and funnel close together
// through two genuine pinch points where the room narrows to a single
// double-track-width corridor:
//   - the kitchen/doorway-cupboard neck (x 0.415-1.585, z 0.75-3.45)
//   - the sofa-chaise neck (x -1.585-0.235, z -1.855 to -0.955)
// The south end finishes in the open doorway foyer (NOTES.md: "100cm clear
// from the doorway corner"), close to the corner nearest the entrance, so
// it is ready to be extended through a tunnel toward the hall later
// (see NOTES.md "Plan", item 4). All coordinates are absolute room/world
// metres, so trackGroup carries no transform of its own.
const trackGroup = new THREE.Group();
scene.add(trackGroup);

const TRACK_HEIGHT = 0.003; // ~3mm rail height off the floor

// The two end turns are genuine constant-radius semicircles (like a real
// stadium-shaped oval's end caps), not sparse hand-placed corner points —
// a spline forced through only 1-2 points at a sharp direction reversal
// produces an uneven, pointy "V" with wildly swinging tangents, which is
// what made the train snap/spin unrealistically at each end instead of
// arcing round smoothly. Radius is kept small (0.25m) because both ends
// have limited clearance to the wall once the lane separation is added
// (0.555m at the south/doorway end, 0.79m at the north end).
const TURN_RADIUS = 0.25; // metres
const TURN_SEGS = 24;

function arcPoints(cx, cz, radius, fromDeg, toDeg, segs) {
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const a = THREE.MathUtils.degToRad(fromDeg + ((toDeg - fromDeg) * i) / segs);
    pts.push([cx + radius * Math.cos(a), cz + radius * Math.sin(a)]);
  }
  return pts;
}

// South turn: in the open doorway foyer, bulging toward the entrance
// (apex at +z, away from the room) between the kitchen-neck exit and the
// doorway-cupboard-run entrance.
const southArc = arcPoints(1.00, 4.15, TURN_RADIUS, 180, 0, TURN_SEGS); // west conn -> apex(+z) -> east conn

// North turn: in the open band below the north wall, bulging toward the
// wall (apex at -z, away from the room) between the sofa-run exit and the
// left-wall-cupboard entrance.
const northArc = arcPoints(-0.25, -4.15, TURN_RADIUS, 0, -180, TURN_SEGS); // east conn -> apex(-z) -> west conn

const TRACK_WAYPOINTS = [
  ...southArc, // west conn (0.75, 4.15) -> apex (1.00, 4.40) -> east conn (1.25, 4.15)
  // -- east lane, north-bound, clear of the doorway cupboards then the sofa --
  [ 1.35,  3.90],
  [ 1.35,  3.00],
  [ 1.35,  2.00],
  [ 1.35,  0.90], // exiting the kitchen/doorway-cupboard neck
  [ 0.90,  0.30], // crossing the fully-open band
  [ 0.30, -0.50],
  [-0.10, -1.40], // through the sofa-chaise neck (paired with the west lane)
  [ 0.70, -2.30], // clear of the sofa (main piece)'s west edge
  [ 0.90, -3.30],
  [ 0.20, -3.70], // funnelling in to the north turn's narrower gauge
  ...northArc, // east conn (0.00, -4.15) -> apex (-0.25, -4.40) -> west conn (-0.50, -4.15)
  // -- west lane, south-bound, clear of the left-wall cupboard then the kitchen --
  [-0.50, -3.70], // funnelling out from the north turn
  [-1.10, -3.20],
  [-1.35, -2.20], // clear of left-wall cupboard
  [-1.10, -1.40], // through the sofa-chaise neck (paired with the east lane at the same z)
  [-1.10, -0.30], // past the chaise, cupboard still clearing to the west
  [-0.30,  0.30], // crossing the fully-open band in front of the doorway gap
  [ 0.65,  0.90], // entering the kitchen/doorway-cupboard neck
  [ 0.65,  2.00],
  [ 0.65,  3.00], // bathroom wall now on the west side, not furniture
  [ 0.65,  3.90], // exiting the neck into the doorway foyer, feeding back into the south turn
];

// 'centripetal' parameterization (rather than the default-looking uniform
// 'catmullrom') is what three.js recommends for non-uniformly spaced
// points — the waypoints above are wildly uneven (tight arc points ~3cm
// apart vs straight runs ~1m apart), and uniform Catmull-Rom overshoots/
// loops in exactly that situation, right at the dense/sparse transitions.
const centreline = TRACK_WAYPOINTS.map(([x, z]) => new THREE.Vector3(x, TRACK_HEIGHT, z));
const curve = new THREE.CatmullRomCurve3(centreline, true, 'centripetal', 0.0);

// Everything that needs a point-on-the-track (rails, sleepers and train
// motion) reads from ONE shared, high-resolution arc-length table built
// below, rather than each calling curve.getPointAt()/getTangentAt()
// independently. Those methods invert their own lower-resolution internal
// lookup table (default 200 divisions, built from uniform-t sampling),
// which isn't precise enough across a ~15-20m loop mixing 3cm-tight turns
// with 1m-long straights — small inversion errors there were (a) making
// the train's speed visibly uneven frame to frame (jerk: measured up to a
// 57% step-distance swing before this fix), and (b) letting the rails
// themselves (previously re-fitted through a SECOND, separate Catmull-Rom
// curve built from offset points) diverge slightly from the train's
// actual path on the tight turns, which is what read as the train
// "leaving the track". Building our own table once, directly from raw
// curve.getPoint(t) samples, and having every consumer do simple
// distance-based lookups into it removes both problems at the source.
const TRACK_SAMPLES = 6000;
const trackPts = [];
for (let i = 0; i <= TRACK_SAMPLES; i++) trackPts.push(curve.getPoint(i / TRACK_SAMPLES));
const trackDist = [0];
for (let i = 1; i < trackPts.length; i++) trackDist.push(trackDist[i - 1] + trackPts[i].distanceTo(trackPts[i - 1]));
const trackLength = trackDist[trackDist.length - 1];

// Binary-search trackDist for the two samples bracketing arc-length s,
// then linearly interpolate position and (from the same two samples)
// direction of travel — accurate to within a single sample's distance
// (~trackLength/6000, a few mm), far finer than anything visible.
function pointAndTangentAtDistance(s) {
  s = ((s % trackLength) + trackLength) % trackLength;
  let lo = 0, hi = trackDist.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (trackDist[mid] <= s) lo = mid; else hi = mid;
  }
  const segLen = trackDist[hi] - trackDist[lo];
  const frac = segLen > 0 ? (s - trackDist[lo]) / segLen : 0;
  const point = trackPts[lo].clone().lerp(trackPts[hi], frac);
  const tangent = trackPts[hi].clone().sub(trackPts[lo]).normalize();
  return { point, tangent };
}

function buildRail(offset) {
  const divisions = TRACK_SAMPLES;
  const pts = [];
  for (let i = 0; i <= divisions; i++) {
    const s = (i / divisions) * trackLength;
    const { point, tangent } = pointAndTangentAtDistance(s);
    const side = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0)).normalize();
    pts.push(point.addScaledVector(side, offset));
  }
  // A straight line-segment path through these already-smooth, very
  // closely spaced points (~2.5mm apart) — no further curve-fitting step
  // that could reintroduce overshoot.
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0), divisions, 0.0015, 6, false);
}

const railMat = new THREE.MeshStandardMaterial({ color: 0x8a8d90, metalness: 0.6, roughness: 0.4 });
const railL = new THREE.Mesh(buildRail(GAUGE / 2), railMat);
const railR = new THREE.Mesh(buildRail(-GAUGE / 2), railMat);
railL.castShadow = true;
railR.castShadow = true;
trackGroup.add(railL, railR);

const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3626, roughness: 1 });
const sleeperGeo = new THREE.BoxGeometry(GAUGE * 2.2, 0.0015, 0.012);
const SLEEPER_COUNT = 260;
for (let i = 0; i < SLEEPER_COUNT; i++) {
  const s = (i / SLEEPER_COUNT) * trackLength;
  const { point, tangent } = pointAndTangentAtDistance(s);
  const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
  sleeper.position.copy(point);
  sleeper.position.y -= 0.0018;
  sleeper.lookAt(point.clone().add(tangent));
  trackGroup.add(sleeper);
}

// ---------- Train: tank engine + two coaches ----------
// Long axis of every vehicle runs along local Z, because Object3D.lookAt()
// (used in placeAt() below) faces an object's -Z axis at its target.
// Wheels/buffers/chimney are added for recognisable silhouette; axle
// gauge, body footprint and coupling offsets are unchanged from the
// original placeholder boxes.
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x151515, metalness: 0.4, roughness: 0.6 });
const WHEEL_R = 0.0075;

function addWheelPair(g, z) {
  for (const side of [-1, 1]) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.004, 12), wheelMat);
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(side * (GAUGE / 2 + 0.002), WHEEL_R, z);
    wheel.castShadow = true;
    g.add(wheel);
  }
}

function makeLoco() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1f3b57, metalness: 0.3, roughness: 0.5 });
  const detailMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.5, roughness: 0.4 });

  // Boiler: a horizontal cylinder, the classic tank-engine barrel shape.
  const boiler = new THREE.Mesh(new THREE.CylinderGeometry(0.0135, 0.0135, 0.075, 14), bodyMat);
  boiler.rotation.x = Math.PI / 2;
  boiler.position.set(0, 0.0225, 0.01);
  g.add(boiler);

  // Footplate/tanks: a flat base the boiler and cab sit on.
  const footplate = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.105), bodyMat);
  footplate.position.set(0, 0.012, 0);
  g.add(footplate);

  const cab = new THREE.Mesh(new THREE.BoxGeometry(0.027, 0.04, 0.032), bodyMat);
  cab.position.set(0, 0.045, -0.034);
  g.add(cab);

  const chimney = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.004, 0.018, 10), detailMat);
  chimney.position.set(0, 0.0525, 0.034);
  g.add(chimney);

  const dome = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.006, 0.01, 10), detailMat);
  dome.position.set(0, 0.0375, 0.006);
  g.add(dome);

  const buffer = new THREE.CylinderGeometry(0.0025, 0.0025, 0.012, 8);
  for (const side of [-1, 1]) {
    const b = new THREE.Mesh(buffer, detailMat);
    b.rotation.x = Math.PI / 2;
    b.position.set(side * 0.011, 0.018, 0.058);
    g.add(b);
  }

  addWheelPair(g, 0.032);
  addWheelPair(g, -0.028);

  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function makeCoach() {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x7a2e2e, roughness: 0.6 });
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c5c5c, roughness: 0.7 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0xbfd4de, roughness: 0.3, metalness: 0.2 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.03, 0.13), bodyMat);
  body.position.y = 0.024;
  g.add(body);

  // Window strip: a thin lighter band let into the body side, rather than
  // a plain solid box, so the coach reads as passenger stock.
  const windows = new THREE.Mesh(new THREE.BoxGeometry(0.0265, 0.012, 0.11), glassMat);
  windows.position.y = 0.03;
  g.add(windows);

  // Roof: a half-cylinder laid along the coach's length.
  const roofGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.13, 12, 1, false, 0, Math.PI);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.rotation.z = Math.PI / 2;
  roof.rotation.y = Math.PI / 2;
  roof.position.y = 0.039;
  g.add(roof);

  const buffer = new THREE.CylinderGeometry(0.0025, 0.0025, 0.012, 8);
  const bufferMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.5, roughness: 0.4 });
  for (const zEnd of [0.065, -0.065]) {
    for (const side of [-1, 1]) {
      const b = new THREE.Mesh(buffer, bufferMat);
      b.rotation.x = Math.PI / 2;
      b.position.set(side * 0.011, 0.012, zEnd + (zEnd > 0 ? 0.006 : -0.006));
      g.add(b);
    }
  }

  addWheelPair(g, 0.045);
  addWheelPair(g, -0.045);

  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

const loco = makeLoco();
const coach1 = makeCoach();
const coach2 = makeCoach();
trackGroup.add(loco, coach1, coach2);

// Thin coupling rods so the three vehicles read as one connected train
// rather than three separate floating blocks.
const couplingMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
function makeCoupling() {
  return new THREE.Mesh(new THREE.CylinderGeometry(0.0025, 0.0025, 1, 6), couplingMat);
}
const coupling1 = makeCoupling();
const coupling2 = makeCoupling();
trackGroup.add(coupling1, coupling2);

const UP = new THREE.Vector3(0, 1, 0);
function alignCoupling(mesh, posA, posB) {
  const dir = new THREE.Vector3().subVectors(posB, posA);
  const len = dir.length();
  mesh.position.copy(posA).addScaledVector(dir, 0.5);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
}

// ---------- Train motion ----------
let scaleMph = 25;
let running = true;
let trainDist = 0; // metres travelled along the track (wraps at trackLength)

function metresPerSecondFromScaleMph(mph) {
  const realMps = mph * 0.44704; // mph -> m/s at full size
  return realMps / SCALE;        // model speed at 1:76
}

// Coaches are placed at a fixed trailing distance (in real metres) behind
// the loco along the SAME arc-length table the loco uses, rather than
// each vehicle being positioned independently — this is what makes the
// rake read as being pulled by the engine (rigidly spaced along the
// track it's following) instead of three vehicles moving on their own.
const COACH1_GAP = 0.17; // metres, loco to coach1
const COACH2_GAP = 0.34; // metres, loco to coach2

function placeAt(obj, s) {
  const { point, tangent } = pointAndTangentAtDistance(s);
  obj.position.copy(point);
  obj.position.y += 0.025;
  obj.lookAt(point.clone().add(tangent));
}

function updateTrain(dt) {
  if (running) {
    const modelMps = metresPerSecondFromScaleMph(scaleMph);
    trainDist += modelMps * dt;
  }
  placeAt(loco, trainDist);
  placeAt(coach1, trainDist - COACH1_GAP);
  placeAt(coach2, trainDist - COACH2_GAP);
  alignCoupling(coupling1, loco.position, coach1.position);
  alignCoupling(coupling2, coach1.position, coach2.position);
}

// ---------- Cameras ----------
// Child's-eye: orbits the room, height clamped to 30-50cm off the floor.
// Defaults to a point in the wide-open band in front of the kitchen/
// doorway neck, looking along both lanes of the loop.
childCamera.position.set(0, 0.4, 1.3);
const childControls = new OrbitControls(childCamera, renderer.domElement);
childControls.target.set(0, 0.1, -0.3);
childControls.minDistance = 0.3;
childControls.maxDistance = 4;
childControls.maxPolarAngle = Math.PI * 0.49;
childControls.update();
childControls.addEventListener('change', () => {
  childCamera.position.y = Math.min(0.5, Math.max(0.3, childCamera.position.y));
});

// Bird's-eye: locked top-down plan view of the living room. Rotation is
// disabled entirely (orthographic + no tilt) so this always reads as a
// flat plan, not a perspective shot; pan and zoom still work.
birdCamera.position.set(0, 10, 0);
birdCamera.up.set(0, 0, -1); // avoid an undefined up-vector when looking straight down
birdCamera.lookAt(0, 0, 0);
const birdControls = new OrbitControls(birdCamera, renderer.domElement);
birdControls.target.set(0, 0, 0);
birdControls.enableRotate = false;
birdControls.minZoom = 0.4;
birdControls.maxZoom = 4;
birdControls.update();

// ---------- UI ----------
const btnChild = document.getElementById('viewChild');
const btnBird = document.getElementById('viewBird');
btnChild.addEventListener('click', () => {
  activeCamera = childCamera;
  btnChild.classList.add('active');
  btnBird.classList.remove('active');
});
btnBird.addEventListener('click', () => {
  activeCamera = birdCamera;
  btnBird.classList.add('active');
  btnChild.classList.remove('active');
});

const toggleBtn = document.getElementById('toggleRun');
toggleBtn.addEventListener('click', () => {
  running = !running;
  toggleBtn.textContent = running ? 'Pause' : 'Run';
});

const speedSlider = document.getElementById('speedSlider');
const speedLabel = document.getElementById('speedLabel');
speedSlider.addEventListener('input', () => {
  scaleMph = Number(speedSlider.value);
  speedLabel.textContent = scaleMph;
});

// ---------- Resize ----------
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  childCamera.aspect = window.innerWidth / window.innerHeight;
  childCamera.updateProjectionMatrix();
  updateBirdFrustum();
});

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  updateTrain(dt);
  if (activeCamera === childCamera) childControls.update();
  if (activeCamera === birdCamera) birdControls.update();
  renderer.render(scene, activeCamera);
}
animate();
</script>
</body>
</html>
